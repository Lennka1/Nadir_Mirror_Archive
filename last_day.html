<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&display=swap">
<style>
:root{--lh:46px;--serif:'Cinzel','Trajan Pro','Times New Roman',Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#030303}

/* чёрный гранит: зернистая фактура + тусклый свет сверху */
.stone{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 30%,#1a1a19 0%,#0a0a0a 60%,#030303 100%)}
.grain{position:fixed;inset:0;z-index:1;opacity:.16;pointer-events:none;mix-blend-mode:screen;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='7'/><feColorMatrix values='0 0 0 0 .8  0 0 0 0 .8  0 0 0 0 .78  0 0 0 .9 -.25'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* панель стены: два едва заметных шва по краям */
.panel{position:fixed;top:0;bottom:0;left:50%;width:min(30rem,90vw);transform:translateX(-50%);z-index:2;
  border-left:1px solid rgba(255,255,255,.045);border-right:1px solid rgba(255,255,255,.045);
  -webkit-mask-image:linear-gradient(transparent 0,#000 16%,#000 80%,transparent 100%);
  mask-image:linear-gradient(transparent 0,#000 16%,#000 80%,transparent 100%)}
#roll{position:absolute;inset:0;will-change:transform}
.n{position:absolute;left:0;right:0;height:var(--lh);line-height:var(--lh);text-align:center;white-space:nowrap;
  font:500 clamp(.95rem,2.1vw,1.3rem)/var(--lh) var(--serif);letter-spacing:.2em;color:#b8b6ae;
  /* «высеченные» буквы: тёмная кромка сверху, светлая снизу */
  text-shadow:0 -1px 0 rgba(0,0,0,.95),0 1px 0 rgba(255,255,255,.13)}

.vig{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,#000 100%)}

/* вход: вспышка, оставшаяся на сетчатке, медленно уходит */
.white{position:fixed;inset:0;z-index:10;background:#fff;pointer-events:none;animation:wh 6.5s cubic-bezier(.3,.6,.3,1) forwards}
@keyframes wh{0%,9%{opacity:1}100%{opacity:0}}
.out{position:fixed;inset:0;z-index:20;background:#000;opacity:0;pointer-events:none}
.out.on{opacity:1}
@media (prefers-reduced-motion:reduce){.white{animation-duration:2s}}
</style>
</head>
<body>
<div class="stone"></div><div class="grain"></div>
<div class="panel"><div id="roll"></div></div>
<div class="vig"></div><div class="white" id="white"></div><div class="out" id="out"></div>

<script>
const T0=performance.now(), DUR=62, JAMES=74;      /* сколько идёт список (с) / номер строки с James Taylor */
const AUTO_RETURN=true, RETURN_TO='index.html';
const now=()=>(performance.now()-T0)/1000;

/* ===== звук: звон после взрыва, потом почти тишина; к концу — нарастающий гул ===== */
let A=null,M=null,RG=null,WG=null,SG=null,ready=false;
function build(){
  M=A.createGain(); M.connect(A.destination);
  [3150,3820].forEach((f,i)=>{ const o=A.createOscillator(),g=A.createGain(); o.frequency.value=f; g.gain.value=i?.35:1; o.connect(g); if(!RG){RG=A.createGain(); RG.gain.value=0; RG.connect(M);} g.connect(RG); o.start(); });
  const b=A.createBuffer(1,A.sampleRate*2,A.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const n=A.createBufferSource(), lp=A.createBiquadFilter(); n.buffer=b; n.loop=true; lp.type='lowpass'; lp.frequency.value=380;
  WG=A.createGain(); WG.gain.value=0; n.connect(lp); lp.connect(WG); WG.connect(M); n.start();
  SG=A.createGain(); SG.gain.value=0; SG.connect(M);
  [41,43.5,82.2].forEach(f=>{ const o=A.createOscillator(); o.frequency.value=f; o.connect(SG); o.start(); });
}
function boot(){
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return; if(!A) A=new C();
  A.resume().then(()=>{ if(!ready && A.state==='running'){ ready=true; build(); } }).catch(()=>{});
}
boot();  /* если автозвук заблокирован — включится при первом нажатии/касании */
['pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e,boot,{passive:true}));
setInterval(()=>{
  if(!ready) return; const t=now(), n=A.currentTime;
  RG.gain.setTargetAtTime(.1*Math.exp(-t/2.4),n,.2);                    /* звон затухает */
  WG.gain.setTargetAtTime(.03*Math.min(1,t/9),n,.5);                    /* далёкий ветер над полем */
  SG.gain.setTargetAtTime(.13*Math.pow(Math.min(1,t/DUR),2.2),n,.4);   /* под землёй что-то поднимается */
},100);

/* ===== имена: сначала 1916 (звания), потом просто фамилии, потом полные имена ===== */
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const R=mulberry(1916), pick=a=>a[Math.floor(R()*a.length)];
const ltr=()=>String.fromCharCode(65+Math.floor(R()*26))+'.';
const UK=['Whitcombe','Ashworth','Pickering','Hollis','Dunmore','Talbot','Greaves','Fenwick','Marlowe','Cartwright','Hargreaves','Blythe','Thackeray','Lowry','Penhale','Sutcliffe','Rowntree','Askew'];
const FR=['Lefèvre','Moreau','Duval','Girard','Bonnet','Marchand','Roussel','Fournier','Lambert','Vasseur','Delorme','Ribeaud'];
const DE=['Brandt','Kessler','Vogel','Hartmann','Lindner','Weiss','Keller','Schroeder','Neumann','Albrecht','Reinhardt','Bauer'];
const MIX=UK.concat(FR,DE,['Kowalski','Rossi','Byrne','O’Malley','Novak','Lindqvist','Petrov','Ferreira','Haddad']);
const FIRST=['Anna','Marcus','Elena','David','Sofia','Tomas','Ruth','Ivan','Mei','Daniel','Lena','Peter','Nora','Paul','Katya','Samuel','Ingrid','Jonas','Maria','Oskar','Clara','Viktor','Hana','Leon'];
const LAST=['Hale','Novak','Ito','Ferreira','Lindqvist','Okafor','Brennan','Vogel','Sato','Moretti','Haddad','Petrov','Kim','Walsh','Rivera','Stein','Almeida','Kowal'];
function nameFor(k){
  if(k===JAMES) return 'JAMES TAYLOR';
  let s;
  if(k<32){
    const r=R(), ini=ltr()+(R()<.4?' '+ltr():'');
    if(r<.5) s=pick(['PTE.','PTE.','PTE.','L/CPL.','CPL.','SGT.','2ND LT.','CAPT.'])+' '+ini+' '+pick(UK);
    else if(r<.75) s=pick(['SOLDAT','SOLDAT','CAPORAL','SERGENT'])+' '+ini+' '+pick(FR);
    else s=pick(['GEFR.','MUSK.','UFFZ.','LT.'])+' '+ini+' '+pick(DE);
  } else if(k<58){ s=ltr()+(R()<.5?' '+ltr():'')+' '+pick(MIX); }
  else { s=pick(FIRST)+' '+pick(LAST); }
  return s.toUpperCase();
}

/* ===== прокрутка: ускоряется; возле James Taylor замедляется, чтобы успели заметить ===== */
const roll=document.getElementById('roll');
const LH=innerWidth<600?38:46; document.documentElement.style.setProperty('--lh',LH+'px');
const H=()=>innerHeight, lineY=k=>H()+k*LH;
let off=0,next=0,last=performance.now(); const live=[];
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000); last=ts; const t=now();
  if(t>=DUR) return;
  let lps=1+2*Math.min(1,t/DUR);
  const jy=lineY(JAMES)-off+LH/2, d=Math.abs(jy-H()/2)/(LH*3);
  if(d<1) lps*=1-.6*(1-d);
  off+=lps*LH*dt;
  while(lineY(next)-off<H()+LH*2){
    const e=document.createElement('div'); e.className='n'; e.textContent=nameFor(next); e.style.top=lineY(next)+'px';
    roll.appendChild(e); live.push(e); next++;
  }
  while(live.length && parseFloat(live[0].style.top)-off<-LH*2) live.shift().remove();
  roll.style.transform='translateY('+(-off)+'px)';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.getElementById('white').addEventListener('animationend',e=>e.target.remove());

/* ===== конец: обрыв посреди списка, полная тишина, возврат в терминал ===== */
function leave(){ location.href=RETURN_TO; }
setTimeout(()=>{
  if(ready){ M.gain.cancelScheduledValues(A.currentTime); M.gain.setValueAtTime(0,A.currentTime); }
  document.getElementById('out').classList.add('on');
  if(AUTO_RETURN) setTimeout(leave,2200);
}, DUR*1000);
addEventListener('keydown',e=>{ if(e.key==='Escape') leave(); });   /* аварийный выход для ведущего */
</script>
</body>
</html>
